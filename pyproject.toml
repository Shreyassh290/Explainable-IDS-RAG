[project]
name = "ids-rag-mitigation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shreyassh290", email = "shreyassh354@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bert-score>=0.3.13",
    "faiss-cpu>=1.15.1",
    "fpdf2>=2.9.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "ollama>=0.6.3",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pypdf>=7.0.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.6.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "shap>=0.51.0",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ids_rag"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
