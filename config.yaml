seed: 42

paths:
  raw: data/raw
  processed: data/processed
  kb: data/kb
  models: models
  artifacts: artifacts
  reports: artifacts/reports

inspect:
  chunksize: 200000

preprocess:
  benign_cap: 300000
  attack_cap: 300000
  corr_threshold: 0.95
  split:
    train: 0.70
    val: 0.15
    test: 0.15
  id_columns:
    - "Flow ID"
    - "Src IP"
    - "Src Port"
    - "Dst IP"
    - "Dst Port"
    - "Timestamp"
  label_map:
    Benign:
      - "Benign"
    DoS:
      - "DoS attacks-Hulk"
      - "DoS attacks-SlowHTTPTest"
      - "DoS attacks-GoldenEye"
      - "DoS attacks-Slowloris"
    DDoS:
      - "DDOS attack-HOIC"
      - "DDoS attacks-LOIC-HTTP"
      - "DDOS attack-LOIC-UDP"

model:
  hidden:
    - 128
    - 64
    - 32
  dropout: 0.3
  use_batchnorm: false
  num_workers: 0
  lr: 0.001
  batch_size: 512
  max_epochs: 100
  early_stopping_patience: 5
  monitor: "f1"

ensemble:
  tiers:
    very_high: 0.95
    high: 0.70
    medium: 0.50
  use_temperature: false

explain:
  top_k: 5
  method: "gradient"


rag:
  embed_model: "sentence-transformers/all-mpnet-base-v2"
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  index_dir: "data/kb/index"
  embed_batch_size: 32
  embed_device: "auto"
  chunk_min_tokens: 200
  chunk_max_tokens: 350
  chunk_overlap: 200
  retrieve_k_each: 30
  rrf_k: 60
  fusion_top: 30
  fallback_min_chunks: 3
  fallback_score_threshold: 0.5
  fallback_sections:
    - source: "NIST_SP_800-61_Rev2.pdf"
      section: "Executive Summary"
    - source: "NIST_SP_800-61_Rev2.pdf"
      section: "3.6 Recommendations"
  final_k: 5
  fusion_weights:
    semantic: 0.60
    bm25: 0.40
  bm25_k1: 1.5
  bm25_b: 0.75

llm:
  model: llama3:8b  # Name of Ollama model to use for report generation
  host: http://localhost:11434  # URL of local Ollama server
  temperature: 0.2  # Sampling temperature for deterministic generation
  seed: 42  # Seed for reproducible LLM sampling
  num_ctx: 8192  # Context window size in tokens
  num_predict: 1100  # Maximum output generation tokens
  keep_alive: "15m"  # Duration to keep model loaded in Ollama memory
  request_timeout_s: 600  # HTTP request timeout in seconds for Ollama client
  min_words: 300  # Minimum report word count (paper reference documents are 300-600 words)
  max_words: 600  # Maximum report word count (paper reference documents are 300-600 words)
  suppress_near_average_implications: true  # When true, replace implication of features with |z| < z_near with a fixed baseline sentence
  tier_actions:  # Human-readable SOC action text per confidence tier from paper Table IV
    VERY_HIGH: "Very High: fully automated response"
    HIGH: "High: analyst review within 15 minutes"
    MEDIUM: "Medium: analyst review within 1 hour"
    LOW: "Low: manual deep inspection"
  z_near: 0.5  # Standard deviation threshold for near-average feature value
  z_far: 1.5  # Standard deviation threshold for far-from-average feature value

eval:
  seed: 42
  per_class: 10
  exclude_rows: [0, 3, 4, 637, 100, 2500, 60000]
  flows_file: "artifacts/eval/eval_flows.json"

citation_check:
  # A citation is flagged unverified when its word overlap with the cited chunk is below this value.
  # Fixed on 10 Nov 2026 before any rerun. Informed by the 36 audited rows, so those rows cannot validate it.
  overlap_threshold: 0.5


